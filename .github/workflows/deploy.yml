# Публикация сайта.
#
# Живой сайт: https://ctmedspb.ru/ (хостинг Beget, аккаунт chendee5).
# Техническая копия: https://nikitaa2333333.github.io/
#
# Репозиторий ОДИН: здесь и исходники, и публикация. Пуш в main → GitHub сам
# собирает сайт и выкладывает его в ДВА места: GitHub Pages (job build+deploy,
# без секретов) и Beget (job beget, по SSH-ключу из секретов репозитория:
# BEGET_SSH_KEY / BEGET_SSH_HOST / BEGET_SSH_USER / BEGET_SITE_PATH).
# Джобы независимы: падение одного не трогает другой.
#
# Репозиторий называется <логин>.github.io, поэтому сайт отдаётся С КОРНЯ домена.
# Отсюда важное следствие: ссылки в страницах остаются корневыми (`/vrachi`),
# префикс пути нигде не нужен.
name: Публикация сайта

on:
  push:
    branches: [main]
  workflow_dispatch:

# Права для штатного механизма Pages: читать код, публиковать сайт,
# подтвердить деплой одноразовым токеном.
permissions:
  contents: read
  pages: write
  id-token: write

# Важна последняя версия main; промежуточные публикации отменяем.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # enablement: true — включает Pages и переводит их на публикацию
      # из Actions, если в настройках репозитория это ещё не сделано.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Сборка сайта
        run: npm run build
        env:
          PUBLIC_SITE: https://nikitaa2333333.github.io

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Публикация на Beget (живой домен). Отдельная сборка, а не артефакт из build:
  # у неё другой PUBLIC_SITE — канонические ссылки и sitemap должны указывать
  # на ctmedspb.ru, а не на github.io.
  beget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Сборка сайта
        run: npm run build
        env:
          PUBLIC_SITE: https://ctmedspb.ru

      - name: Ключ и известные хосты
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.BEGET_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.BEGET_SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      # --delete: на сервере остаётся ровно то, что в dist — удалённые из
      # репозитория страницы и картинки не копятся мусором в public_html.
      - name: Выгрузка на Beget
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/id_deploy" \
            dist/ \
            "${{ secrets.BEGET_SSH_USER }}@${{ secrets.BEGET_SSH_HOST }}:${{ secrets.BEGET_SITE_PATH }}/"
